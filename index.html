<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1769aa">
<title>VYAPAAR ERP V2</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#eef3f9;
 color:#101418;
 font-family:Arial,sans-serif
}
header{
 background:#1769aa;
 color:#fff;
 padding:18px;
 text-align:center;
 position:sticky;
 top:0;
 z-index:5
}
header h1{margin:0;font-size:28px}
main{max-width:900px;margin:auto;padding:14px}
.card{
 background:#fff;
 border-radius:22px;
 padding:18px;
 margin-bottom:14px;
 box-shadow:0 4px 16px #0001
}
h2{margin:0 0 16px}
.grid,.menu{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px
}
button{
 border:0;
 border-radius:15px;
 padding:14px;
 font-size:16px;
 font-weight:700;
 cursor:pointer
}
.primary{background:#1769aa;color:white}
.secondary{background:#e4ebf3}
.success{background:#168a4b;color:white}
.danger{background:#d9534f;color:white}
.hide{display:none!important}
label{
 display:block;
 font-weight:bold;
 margin-top:8px
}
input,select{
 width:100%;
 padding:13px;
 margin:6px 0 12px;
 border:1px solid #cbd4df;
 border-radius:12px;
 font-size:16px
}
.row{
 display:flex;
 justify-content:space-between;
 gap:10px;
 padding:11px 0;
 border-bottom:1px solid #e1e5e9
}
.stat{
 background:#f4f7fa;
 border-radius:16px;
 padding:14px
}
.stat b{
 display:block;
 font-size:20px;
 margin-top:5px
}
.badge{
 display:inline-block;
 background:#e5ebf3;
 border-radius:20px;
 padding:5px 9px;
 font-size:12px
}
.small{
 padding:7px 10px;
 font-size:13px
}
.in{color:#168a4b}
.out{color:#d9534f}
.credit{color:#1769aa}
.debit{color:#d9534f}
.empty{
 text-align:center;
 color:#777;
 padding:25px
}
.total{
 font-size:21px;
 font-weight:bold
}
.nav{margin-bottom:12px}

@media(max-width:550px){
 .grid,.menu{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<h1>VYAPAAR ERP V2</h1>
</header>

<main>

<!-- HOME -->
<section id="home">

<div class="card">
<h2>🏠 Home</h2>

<div class="menu">

<button class="primary" onclick="go('entry')">
➕ Daily Entry
</button>

<button class="secondary" onclick="go('ledger');ledger()">
📒 Ledger
</button>

<button class="secondary" onclick="go('cash');cash()">
💵 Cashbook
</button>

<button class="secondary" onclick="go('upi');book('upi')">
📱 UPI Book
</button>

<button class="secondary" onclick="go('bank');book('bank')">
🏦 Bank Book
</button>

<button class="secondary" onclick="go('report');report()">
📊 Daily Report
</button>

<button class="secondary" onclick="go('parties');parties()">
👥 Parties
</button>

<button class="secondary" onclick="go('settings')">
⚙️ Settings
</button>

</div>
</div>

<div class="card">

<h2>📌 Today's Summary</h2>

<div class="grid">

<div class="stat">
Sales
<b id="sale">₹0</b>
</div>

<div class="stat">
Purchase
<b id="purchase">₹0</b>
</div>

<div class="stat">
Jama / Received
<b id="jama">₹0</b>
</div>

<div class="stat">
Gaya / Paid
<b id="gaya">₹0</b>
</div>

</div>

<div class="row">
<b>Today's Balance</b>
<b id="todayBal">₹0</b>
</div>

</div>

</section>


<!-- DAILY ENTRY -->
<section id="entry" class="hide">

<div class="nav">
<button class="secondary" onclick="go('home')">
← Home
</button>
</div>

<div class="card">

<h2>➕ Daily Entry</h2>

<label>Date</label>
<input id="date" type="date">

<label>Party Type</label>

<select id="ptype" onchange="entryTypes()">
<option value="customer">Customer</option>
<option value="supplier">Supplier</option>
</select>

<label>Party Name</label>

<input
 id="party"
 list="plist"
 placeholder="Customer / Supplier name">

<datalist id="plist"></datalist>

<label>Entry Type</label>

<select id="etype"></select>

<label>Amount ₹</label>

<input
 id="amount"
 type="number"
 inputmode="decimal"
 min="0">

<label>Payment Mode</label>

<select id="mode">
<option value="cash">Cash</option>
<option value="upi">UPI</option>
<option value="bank">Bank</option>
<option value="credit">Credit / Udhaar</option>
</select>

<label>Particular</label>

<input
 id="remark"
 placeholder="Particular">

<div class="grid">

<button class="primary" onclick="add()">
💾 Save Entry
</button>

<button class="secondary" onclick="clearForm()">
↻ Clear
</button>

</div>

</div>
</section>


<!-- LEDGER -->
<section id="ledger" class="hide">

<div class="nav">
<button class="secondary" onclick="go('home')">
← Home
</button>
</div>

<div class="card">

<h2>📒 Ledger</h2>

<input
 id="search"
 placeholder="🔎 Search Party"
 oninput="ledger()">

<div id="ledgerOut"></div>

</div>
</section>


<!-- PARTY DETAIL -->
<section id="detail" class="hide">

<div class="nav">

<button
 class="secondary"
 onclick="go('ledger');ledger()">
← Ledger
</button>

</div>

<div class="card">

<h2 id="detailTitle">
Party Ledger
</h2>

<div id="detailOut"></div>

</div>

</section>


<!-- CASHBOOK -->
<section id="cash" class="hide">

<div class="nav">
<button class="secondary" onclick="go('home')">
← Home
</button>
</div>

<div class="card">

<h2>💵 Cashbook</h2>

<label>Date</label>

<input
 id="cashDate"
 type="date"
 onchange="cash()">

<div id="cashOut"></div>

</div>
</section>


<!-- UPI -->
<section id="upi" class="hide">

<div class="nav">
<button class="secondary" onclick="go('home')">
← Home
</button>
</div>

<div class="card">

<h2>📱 UPI Book</h2>

<div id="upiOut"></div>

</div>
</section>


<!-- BANK -->
<section id="bank" class="hide">

<div class="nav">
<button class="secondary" onclick="go('home')">
← Home
</button>
</div>

<div class="card">

<h2>🏦 Bank Book</h2>

<div id="bankOut"></div>

</div>
</section>


<!-- DAILY REPORT -->
<section id="report" class="hide">

<div class="nav">
<button class="secondary" onclick="go('home')">
← Home
</button>
</div>

<div class="card">

<h2>📊 Daily Report</h2>

<label>Date</label>

<input
 id="rdate"
 type="date"
 onchange="report()">

<div id="reportOut"></div>

</div>
</section>


<!-- PARTIES -->
<section id="parties" class="hide">

<div class="nav">
<button class="secondary" onclick="go('home')">
← Home
</button>
</div>

<div class="card">

<h2>👥 Parties</h2>

<div id="partyOut"></div>

</div>
</section>


<!-- SETTINGS -->
<section id="settings" class="hide">

<div class="nav">
<button class="secondary" onclick="go('home')">
← Home
</button>
</div>

<div class="card">

<h2>⚙️ Settings</h2>

<p>
Edit/Delete ke liye PIN required hai.
</p>

<label>New PIN</label>

<input
 id="newpin"
 type="password"
 maxlength="6"
 inputmode="numeric">

<button
 class="primary"
 onclick="changePin()">
🔐 Change PIN
</button>

</div>

<div class="card">

<h3>📦 Backup</h3>

<button
 class="secondary"
 onclick="backup()">
⬇️ Download Backup
</button>

</div>

</section>


<!-- EDIT -->
<section id="edit" class="hide">

<div class="nav">

<button
 class="secondary"
 onclick="go('ledger');ledger()">
← Ledger
</button>

</div>

<div class="card">

<h2>✏️ Edit Entry</h2>

<input id="eid" type="hidden">

<label>Date</label>
<input id="edate" type="date">

<label>Party Type</label>

<select id="eptype" onchange="editTypes()">
<option value="customer">Customer</option>
<option value="supplier">Supplier</option>
</select>

<label>Party</label>
<input id="eparty">

<label>Entry Type</label>
<select id="eetype"></select>

<label>Amount</label>
<input id="eamount" type="number">

<label>Mode</label>

<select id="emode">
<option value="cash">Cash</option>
<option value="upi">UPI</option>
<option value="bank">Bank</option>
<option value="credit">Credit / Udhaar</option>
</select>

<label>Particular</label>
<input id="eremark">

<button
 class="success"
 onclick="update()">
💾 Update Entry
</button>

</div>
</section>


<script>

const K='vyapaar_erp_v2_data';
const PK='vyapaar_erp_v2_pin';

let D=JSON.parse(
 localStorage.getItem(K)||'[]'
);

let PIN=
 localStorage.getItem(PK)||'1234';

const $=x=>
 document.getElementById(x);

const today=()=>
 new Date().toISOString().slice(0,10);

const money=n=>
 '₹'+Number(n||0).toLocaleString(
 'en-IN',
 {maximumFractionDigits:2}
 );

const name={
 sale:'Sale',
 purchase:'Purchase',
 jama:'Jama (Received)',
 gaya:'Gaya (Paid)'
};


function fmtDate(s){

 if(!s)return '';

 let p=s.split('-');

 return p.length===3
 ? `${p[2]}-${p[1]}-${p[0].slice(-2)}`
 : s;
}


function esc(s){

 return String(s??'').replace(
 /[&<>"']/g,
 c=>({
 '&':'&amp;',
 '<':'&lt;',
 '>':'&gt;',
 '"':'&quot;',
 "'":'&#039;'
 }[c])
 );

}


function go(id){

 document
 .querySelectorAll('main>section')
 .forEach(x=>x.classList.add('hide'));

 $(id).classList.remove('hide');

 scrollTo(0,0);

 if(id==='entry'){
  fill();
  entryTypes();
 }

}


function save(){

 localStorage.setItem(
  K,
  JSON.stringify(D)
 );

 home();
}


function sum(a,t){

 return a
 .filter(x=>x.type===t)
 .reduce(
  (s,x)=>s+Number(x.amount),
  0
 );

}


/*
Customer:
Sale = CREDIT
Jama = DEBIT

Supplier:
Purchase = CREDIT
Gaya = DEBIT
*/

function signed(x){

 if(x.partyType==='customer'){

  return x.type==='sale'
   ? +Number(x.amount)
   : -Number(x.amount);

 }

 return x.type==='purchase'
  ? +Number(x.amount)
  : -Number(x.amount);

}


function balance(a){

 let pt=
  a[0]?.partyType||'customer';

 let b=
  a.reduce(
   (s,x)=>s+signed(x),
   0
  );

 return [pt,b];

}


function drcr(pt,b){

 if(!b)return '';

 return b>0
  ? 'Cr'
  : 'Dr';

}


function dayNet(a){

 return a
 .filter(x=>x.mode!=='credit')
 .reduce(
  (s,x)=>
   s+
   (
    x.type==='sale'||x.type==='jama'
    ? Number(x.amount)
    : -Number(x.amount)
   ),
  0
 );

}


function home(){

 let a=
  D.filter(x=>x.date===today());

 $('sale').textContent=
  money(sum(a,'sale'));

 $('purchase').textContent=
  money(sum(a,'purchase'));

 $('jama').textContent=
  money(sum(a,'jama'));

 $('gaya').textContent=
  money(sum(a,'gaya'));

 $('todayBal').textContent=
  money(dayNet(a));

}


function fill(){

 $('plist').innerHTML=
 [...new Set(D.map(x=>x.party))]
 .sort()
 .map(
  x=>`<option value="${esc(x)}">`
 )
 .join('');

}


function entryTypes(){

 let c=$('ptype').value;

 if(c==='customer'){

  $('etype').innerHTML=`
   <option value="sale">
   Sale (Credit)
   </option>

   <option value="jama">
   Jama (Debit / Received)
   </option>
  `;

 }else{

  $('etype').innerHTML=`
   <option value="purchase">
   Purchase (Credit)
   </option>

   <option value="gaya">
   Gaya (Debit / Paid)
   </option>
  `;

 }

}


function editTypes(){

 let c=$('eptype').value;

 if(c==='customer'){

  $('eetype').innerHTML=`
   <option value="sale">
   Sale (Credit)
   </option>

   <option value="jama">
   Jama (Debit / Received)
   </option>
  `;

 }else{

  $('eetype').innerHTML=`
   <option value="purchase">
   Purchase (Credit)
   </option>

   <option value="gaya">
   Gaya (Debit / Paid)
   </option>
  `;

 }

}


function clearForm(){

 $('party').value='';
 $('amount').value='';
 $('remark').value='';
 $('date').value=today();

}


function add(){

 let p=
  $('party').value.trim();

 let a=
  Number($('amount').value);

 if(!p||a<=0)
  return alert(
   'Party aur Amount डालें'
  );

 D.push({

  id:Date.now()+Math.random(),

  date:
   $('date').value||today(),

  partyType:
   $('ptype').value,

  party:p,

  type:
   $('etype').value,

  amount:a,

  mode:
   $('mode').value,

  remark:
   $('remark').value.trim()

 });

 save();

 clearForm();

 alert('Entry Saved ✅');

}


function ledger(){

 let q=
  ($('search').value||'')
  .toLowerCase();

 let ps=
  [...new Set(D.map(x=>x.party))]
  .filter(
   p=>p.toLowerCase().includes(q)
  )
  .sort();

 $('ledgerOut').innerHTML=

 ps.map(p=>{

  let a=
   D.filter(x=>x.party===p);

  let [pt,b]=
   balance(a);

  let side=
   drcr(pt,b);

  return `

  <div class="card">

   <div class="row">

    <div>

     <h3>${esc(p)}</h3>

     <span class="badge">
      ${pt}
     </span>

    </div>

    <button
     class="small primary"
     onclick="openDetail('${encodeURIComponent(p)}')">
     Open
    </button>

   </div>

   <div class="row">
    Sale
    <b>${money(sum(a,'sale'))}</b>
   </div>

   <div class="row">
    Purchase
    <b>${money(sum(a,'purchase'))}</b>
   </div>

   <div class="row">
    Jama
    <b>${money(sum(a,'jama'))}</b>
   </div>

   <div class="row">
    Gaya
    <b>${money(sum(a,'gaya'))}</b>
   </div>

   <div class="row">

    <b>Balance</b>

    <b class="${side==='Cr'
      ?'credit':'debit'}">

     ${money(Math.abs(b))}
     ${side}

    </b>

   </div>

  </div>

  `;

 }).join('')

 ||

 '<div class="empty">
 No ledger
 </div>';

}


function openDetail(p){

 p=decodeURIComponent(p);

 let a=
  D.filter(x=>x.party===p)
  .sort(
   (x,y)=>
   x.date.localeCompare(y.date)||
   x.id-y.id
  );

 let pt=
  a[0]?.partyType||'customer';

 let b=0;

 let html=
 a.map(x=>{

  b+=signed(x);

  let side=
   drcr(pt,b);

  return `

  <div class="row">

   <div>

    <b>${fmtDate(x.date)}</b>

    <br>

    ${name[x.type]}
    • ${x.mode}

    <br>

    <span>
     Particular:
     ${esc(x.remark||'')}
    </span>

   </div>

   <div style="text-align:right">

    <b>
     ${money(x.amount)}
    </b>

    <br>

    <span>
     Bal
     ${money(Math.abs(b))}
     ${side}
    </span>

    <br>

    <button
     class="small secondary"
     onclick="editEntry(${x.id})">
     ✏️
    </button>

    <button
     class="small danger"
     onclick="del(${x.id})">
     🗑️
    </button>

   </div>

  </div>

  `;

 }).join('');

 let side=
  drcr(pt,b);

 $('detailTitle').textContent=
  '📒 '+p+' Ledger';

 $('detailOut').innerHTML=
  html+

  `

  <div class="row">

   <b>Closing Balance</b>

   <b class="total
    ${side==='Cr'
     ?'credit':'debit'}">

    ${money(Math.abs(b))}
    ${side}

   </b>

  </div>

  `;

 go('detail');

}


function pinok(){

 return prompt(
  'PIN डालें'
 )===PIN;

}


function editEntry(id){

 if(!pinok())return;

 let x=
  D.find(z=>z.id==id);

 if(!x)return;

 $('eid').value=x.id;

 $('edate').value=x.date;

 $('eptype').value=
  x.partyType;

 editTypes();

 $('eparty').value=
  x.party;

 $('eetype').value=
  x.type;

 $('eamount').value=
  x.amount;

 $('emode').value=
  x.mode;

 $('eremark').value=
  x.remark||'';

 go('edit');

}


function update(){

 if(!pinok())return;

 let x=
  D.find(
   z=>z.id==$('eid').value
  );

 if(!x)return;

 x.date=
  $('edate').value;

 x.partyType=
  $('eptype').value;

 x.party=
  $('eparty').value.trim();

 x.type=
  $('eetype').value;

 x.amount=
  Number($('eamount').value);

 x.mode=
  $('emode').value;

 x.remark=
  $('eremark').value.trim();

 save();

 alert('Updated ✅');

 go('ledger');

 ledger();

}


function del(id){

 if(
  !pinok()||
  !confirm('Delete entry?')
 )return;

 D=
  D.filter(x=>x.id!=id);

 save();

 go('ledger');

 ledger();

}


function effect(x){

 return
  x.type==='sale'||
  x.type==='jama'
  ? +x.amount
  : -x.amount;

}


function rows(a){

 return a
 .slice()
 .reverse()
 .map(x=>`

 <div class="row">

  <div>

   <b>
    ${fmtDate(x.date)}
    • ${esc(x.party)}
   </b>

   <br>

   ${name[x.type]}
   • ${x.mode}

   <br>

   Particular:
   ${esc(x.remark||'')}

  </div>

  <div>

   <b>
    ${money(x.amount)}
   </b>

   <br>

   <button
    class="small secondary"
    onclick="editEntry(${x.id})">
    ✏️
   </button>

  </div>

 </div>

 `).join('');

}


function cash(){

 let d=
  $('cashDate').value||today();

 $('cashDate').value=d;

 let a=
  D.filter(
   x=>
   x.date===d&&
   x.mode==='cash'
  );

 let i=
  a.filter(x=>effect(x)>0)
  .reduce(
   (s,x)=>s+x.amount,
   0
  );

 let o=
  a.filter(x=>effect(x)<0)
  .reduce(
   (s,x)=>s+x.amount,
   0
  );

 $('cashOut').innerHTML=

 `

 <div class="grid">

  <div class="stat">

   Cash In

   <b class="in">
    ${money(i)}
   </b>

  </div>

  <div class="stat">

   Cash Out

   <b class="out">
    ${money(o)}
   </b>

  </div>

 </div>

 <div class="row">

  <b>Closing Cash</b>

  <b class="total">
   ${money(i-o)}
  </b>

 </div>

 ${rows(a)}

 `;

}


function book(m){

 let id=
  m==='upi'
  ?'upiOut'
  :'bankOut';

 let a=
  D.filter(x=>x.mode===m);

 let i=
  a.filter(x=>effect(x)>0)
  .reduce(
   (s,x)=>s+x.amount,
   0
  );

 let o=
  a.filter(x=>effect(x)<0)
  .reduce(
   (s,x)=>s+x.amount,
   0
  );

 $(id).innerHTML=

 `

 <div class="grid">

  <div class="stat">
   In
   <b class="in">
    ${money(i)}
   </b>
  </div>

  <div class="stat">
   Out
   <b class="out">
    ${money(o)}
   </b>
  </div>

 </div>

 <div class="row">

  <b>Net</b>

  <b>
   ${money(i-o)}
  </b>

 </div>

 ${rows(a)}

 `;

}


function report(){

 let d=
  $('rdate').value||today();

 $('rdate').value=d;

 let a=
  D.filter(x=>x.date===d);

 let net=
  dayNet(a);

 $('reportOut').innerHTML=

 `

 <div class="grid">

  <div class="stat">
   Sale
   <b>
    ${money(sum(a,'sale'))}
   </b>
  </div>

  <div class="stat">
   Purchase
   <b>
    ${money(sum(a,'purchase'))}
   </b>
  </div>

  <div class="stat">
   Jama / Debit
   <b>
    ${money(sum(a,'jama'))}
   </b>
  </div>

  <div class="stat">
   Gaya / Debit
   <b>
    ${money(sum(a,'gaya'))}
   </b>
  </div>

 </div>

 <div class="row">

  <b>Today Balance</b>

  <b class="total">
   ${money(net)}
  </b>

 </div>

 ${rows(a)}

 `;

}


function parties(){

 $('partyOut').innerHTML=

 [...new Set(D.map(x=>x.party))]
 .sort()
 .map(p=>`

 <div class="row">

  <b>
   ${esc(p)}
  </b>

  <button
   class="small primary"
   onclick="openDetail('${encodeURIComponent(p)}')">
   Open
  </button>

 </div>

 `).join('')

 ||

 '<div class="empty">
 No parties
 </div>';

}


function changePin(){

 let p=
  $('newpin').value;

 if(!/^\d{4,6}$/.test(p))
  return alert(
   '4-6 digit PIN डालें'
  );

 PIN=p;

 localStorage.setItem(
  PK,p
 );

 alert(
  'PIN Changed ✅'
 );

}


function backup(){
