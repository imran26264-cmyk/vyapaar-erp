<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1769aa">
<title>VYAPAAR ERP V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef3f9;font-family:Arial,sans-serif;color:#111}
header{background:#1769aa;color:white;padding:22px 15px;text-align:center}
header h1{margin:0;font-size:30px}
main{max-width:800px;margin:auto;padding:18px}
.card{background:white;border-radius:24px;padding:22px;margin-bottom:18px;box-shadow:0 4px 18px #0001}
h2{margin:0 0 18px;font-size:27px}
h3{margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button{border:0;border-radius:15px;padding:16px;font-size:18px;font-weight:bold;cursor:pointer}
.primary{background:#1769aa;color:white}
.secondary{background:#e5ebf3;color:#111}
.green{background:#168a4b;color:white}
.red{background:#d93025;color:white}
.back{margin-bottom:15px}
input,select{width:100%;padding:14px;border:1px solid #ccd3dc;border-radius:12px;font-size:17px;margin:6px 0 12px}
label{font-weight:bold}
.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #ddd}
.amount{font-weight:bold}
.stat{font-size:25px;font-weight:bold;margin:8px 0}
.small{color:#666;font-size:14px}
.hide{display:none}
.danger{color:#d93025}
@media(max-width:550px){.grid{grid-template-columns:1fr}main{padding:12px}}
</style>
</head>

<body>

<header>
<h1>VYAPAAR ERP V2</h1>
</header>

<main>

<!-- HOME -->
<section id="home">
<div class="card">
<h2>🏠 Home</h2>
<div class="grid">
<button class="primary" onclick="show('entry')">➕ Daily Entry</button>
<button class="secondary" onclick="show('ledger');renderLedger()">📒 Ledger</button>
<button class="secondary" onclick="show('cash');renderCash()">💵 Cashbook</button>
<button class="secondary" onclick="show('upi');renderUPI()">📱 UPI Book</button>
<button class="secondary" onclick="show('report');renderReport()">📊 Daily Report</button>
<button class="secondary" onclick="show('parties');renderParties()">👥 Parties</button>
</div>
</div>

<div class="card">
<h3>📌 Today's Summary</h3>
<div class="grid">
<div><div class="small">Sales</div><div id="hsale" class="stat">₹0</div></div>
<div><div class="small">Purchase</div><div id="hpurchase" class="stat">₹0</div></div>
<div><div class="small">Jama</div><div id="hjama" class="stat">₹0</div></div>
<div><div class="small">Gaya</div><div id="hgaya" class="stat">₹0</div></div>
</div>
</div>
</section>

<!-- ENTRY -->
<section id="entry" class="hide">
<button class="secondary back" onclick="show('home')">← Home</button>
<div class="card">
<h2>➕ Daily Entry</h2>

<label>Date</label>
<input type="date" id="date">

<label>Party Name</label>
<input id="party" placeholder="Customer / Supplier">

<label>Entry Type</label>
<select id="type">
<option value="sale">Sale</option>
<option value="purchase">Purchase</option>
<option value="jama">Jama (Received)</option>
<option value="gaya">Gaya (Paid)</option>
</select>

<label>Amount ₹</label>
<input type="number" id="amount" placeholder="0">

<label>Payment Mode</label>
<select id="mode">
<option value="cash">Cash</option>
<option value="upi">UPI</option>
<option value="credit">Credit</option>
</select>

<label>Remark</label>
<input id="remark" placeholder="Remark">

<button class="primary" onclick="saveEntry()">💾 Save Entry</button>
</div>
</section>

<!-- LEDGER -->
<section id="ledger" class="hide">
<button class="secondary back" onclick="show('home')">← Home</button>
<div class="card">
<h2>📒 Ledger</h2>
<input id="ledgerSearch" placeholder="🔎 Search Party" oninput="renderLedger()">
<div id="ledgerOut"></div>
</div>
</section>

<!-- CASHBOOK -->
<section id="cash" class="hide">
<button class="secondary back" onclick="show('home')">← Home</button>
<div class="card">
<h2>💵 Cashbook</h2>
<div id="cashOut"></div>
</div>
</section>

<!-- UPI -->
<section id="upi" class="hide">
<button class="secondary back" onclick="show('home')">← Home</button>
<div class="card">
<h2>📱 UPI Book</h2>
<div id="upiOut"></div>
</div>
</section>

<!-- REPORT -->
<section id="report" class="hide">
<button class="secondary back" onclick="show('home')">← Home</button>
<div class="card">
<h2>📊 Daily Report</h2>
<label>Select Date</label>
<input type="date" id="reportDate" onchange="renderReport()">
<div id="reportOut"></div>
</div>
</section>

<!-- PARTIES -->
<section id="parties" class="hide">
<button class="secondary back" onclick="show('home')">← Home</button>
<div class="card">
<h2>👥 Parties</h2>
<div id="partyOut"></div>
</div>
</section>

</main>

<script>
const KEY="vyapaar_erp_v2_data";

let data=JSON.parse(localStorage.getItem(KEY)||"[]");

function $(id){return document.getElementById(id)}

function save(){
 localStorage.setItem(KEY,JSON.stringify(data));
}

function today(){
 return new Date().toISOString().slice(0,10);
}

$("date").value=today();
$("reportDate").value=today();

function show(id){
 document.querySelectorAll("main>section").forEach(x=>x.classList.add("hide"));
 $(id).classList.remove("hide");
 window.scrollTo(0,0);
}

function money(n){
 return "₹"+Number(n||0).toLocaleString("en-IN");
}

function escapeHtml(s){
 return String(s||"").replace(/[&<>"']/g,m=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#039;"
 }[m]));
}

function saveEntry(){

 let party=$("party").value.trim();
 let amount=Number($("amount").value);

 if(!party){
   alert("Party Name डालें");
   return;
 }

 if(!amount || amount<=0){
   alert("Amount डालें");
   return;
 }

 data.push({
   id:Date.now(),
   date:$("date").value||today(),
   party:party,
   type:$("type").value,
   amount:amount,
   mode:$("mode").value,
   remark:$("remark").value.trim()
 });

 save();

 alert("Entry Saved ✅");

 $("party").value="";
 $("amount").value="";
 $("remark").value="";

 renderHome();
}

function totals(list=data){
 return {
  sale:list.filter(x=>x.type==="sale")
   .reduce((s,x)=>s+x.amount,0),

  purchase:list.filter(x=>x.type==="purchase")
   .reduce((s,x)=>s+x.amount,0),

  jama:list.filter(x=>x.type==="jama")
   .reduce((s,x)=>s+x.amount,0),

  gaya:list.filter(x=>x.type==="gaya")
   .reduce((s,x)=>s+x.amount,0)
 };
}

function renderHome(){

 let t=totals(data.filter(x=>x.date===today()));

 $("hsale").textContent=money(t.sale);
 $("hpurchase").textContent=money(t.purchase);
 $("hjama").textContent=money(t.jama);
 $("hgaya").textContent=money(t.gaya);
}

function partyBalance(p){

 let sale=data.filter(x=>x.party===p && x.type==="sale")
 .reduce((s,x)=>s+x.amount,0);

 let purchase=data.filter(x=>x.party===p && x.type==="purchase")
 .reduce((s,x)=>s+x.amount,0);

 let jama=data.filter(x=>x.party===p && x.type==="jama")
 .reduce((s,x)=>s+x.amount,0);

 let gaya=data.filter(x=>x.party===p && x.type==="gaya")
 .reduce((s,x)=>s+x.amount,0);

 return {
   sale,
   purchase,
   jama,
   gaya,
   balance:(sale+gaya)-(purchase+jama)
 };
}

function renderLedger(){

 let q=($("ledgerSearch").value||"").toLowerCase().trim();

 let parties=[...new Set(data.map(x=>x.party))]
 .filter(p=>p.toLowerCase().includes(q))
 .sort();

 if(!parties.length){
   $("ledgerOut").innerHTML="<p>No ledger entries</p>";
   return;
 }

 $("ledgerOut").innerHTML=parties.map(p=>{

   let b=partyBalance(p);

   return `
   <div class="card" style="box-shadow:none;border:1px solid #ddd">
   <h3>${escapeHtml(p)}</h3>
   <div class="row"><span>Sale</span><b>${money(b.sale)}</b></div>
   <div class="row"><span>Purchase</span><b>${money(b.purchase)}</b></div>
   <div class="row"><span>Jama</span><b>${money(b.jama)}</b></div>
   <div class="row"><span>Gaya</span><b>${money(b.gaya)}</b></div>
   <div class="row">
   <span>Balance</span>
   <b class="${b.balance<0?'danger':''}">
   ${money(Math.abs(b.balance))}
   ${b.balance>0?'Dr':b.balance<0?'Cr':''}
   </b>
   </div>
   </div>`;
 }).join("");
}

function renderCash(){

 let list=data.filter(x=>x.mode==="cash");

 let jama=list.filter(x=>x.type==="jama"||x.type==="sale")
 .reduce((s,x)=>s+x.amount,0);

 let gaya=list.filter(x=>x.type==="gaya"||x.type==="purchase")
 .reduce((s,x)=>s+x.amount,0);

 let balance=jama-gaya;

 $("cashOut").innerHTML=`
 <div class="row"><span>Total Cash In</span><b>${money(jama)}</b></div>
 <div class="row"><span>Total Cash Out</span><b>${money(gaya)}</b></div>
 <div class="row"><span>Cash Balance</span>
 <b>${money(balance)}</b></div>
 <hr>
 ${list.slice().reverse().map(x=>`
 <div class="row">
 <span>${escapeHtml(x.date)}<br>${escape
